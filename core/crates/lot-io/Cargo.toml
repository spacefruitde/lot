[package]
name = "lot-io"
description = "Dateien: Projektdatei (SQLite), Testprojekte (RON), PDF, SVG, PNG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
acadrust = "=0.6.6"
ifc-lite-core = "=20.4.0"
ifc-lite-geometry = "=20.4.0"
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
lot-geom = { version = "0.1.0", path = "../lot-geom" }
lot-model = { version = "0.1.0", path = "../lot-model" }
lot-plan = { version = "0.1.0", path = "../lot-plan" }
ron = "0.12.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustc-hash = "2.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
