[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Auch im Debug-Build schnell genug für die App: Bibliotheken optimiert,
# eigener Code leicht optimiert und gut debugbar.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
